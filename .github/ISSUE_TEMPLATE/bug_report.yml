name: 🐛 Пријава грешке
description: Нешто не ради како треба
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Шта се догодило?
      description: Опишите проблем и шта сте очекивали.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Кораци за репродукцију
      placeholder: |
        1. Отворити '...'
        2. Кликнути на '...'
        3. Видети грешку
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Улога корисника
      options:
        - Admin
        - Viewer
        - Није релевантно
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Прегледач и оперативни систем
      placeholder: Chrome 130 / Windows 11
  - type: textarea
    id: logs
    attributes:
      label: Грешке из конзоле / снимци екрана
      description: Не прилажите осетљиве податке.
